<script type="text/babel">
const { useState, useEffect, useCallback, useRef, memo } = React;

/* ─── CONSTANTS ─────────────────────────────────────────────── */
const OWNER = {
  id: 'owner-abhinandan',
  name: 'Abhinandan Kumar Singh',
  email: 'abhinandan@ration.com',
  password: 'owner123',
  role: 'owner',
  upiId: '8757681959@slc',
  createdAt: new Date().toISOString()
};
const DEFAULT_MEMBERS = [{ id: 'owner-abhinandan', name: 'Abhinandan Kumar Singh' }];
const UNITS = ['kg','g','L','ml','pcs','dozen','pack','box','bag'];

/* ─── FIREBASE CONFIG ─────────────────────────────────────────
   👇 Apna Firebase config yahan paste karo
   Firebase Console → Project Settings → Your Apps → firebaseConfig copy karo
──────────────────────────────────────────────────────────────── */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAKvt-2Ca1pEB72mIc68fFvekI2nu1-iC4",
  authDomain: "rationtrack.firebaseapp.com",
  databaseURL: "https://rationtrack-default-rtdb.firebaseio.com",
  projectId: "rationtrack",
  storageBucket: "rationtrack.firebasestorage.app",
  messagingSenderId: "539126811381",
  appId: "1:539126811381:web:2c8f50b7b31fef6f0f13bc"
};

/* ─── FIREBASE INIT ─────────────────────────────────────────── */
let fbDB = null;
let fbStorage = null;
try {
  if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
  fbDB = firebase.database();
  fbStorage = firebase.storage();
} catch(e) { console.warn('Firebase not configured yet:', e.message); }

const FB_PATH = 'rationtrack';

/* ─── SESSION (device-specific, localStorage) ──────────────── */
const session = {
  get: () => { try { return JSON.parse(localStorage.getItem('rt_session')); } catch { return null; } },
  set: (v) => { try { localStorage.setItem('rt_session', JSON.stringify(v)); } catch {} },
  clear: () => localStorage.removeItem('rt_session'),
};

/* ─── FIREBASE WRITE & LISTEN ───────────────────────────────── */
const fbSet = (key, val) => {
  if (!fbDB) return;
  try { fbDB.ref(`${FB_PATH}/${key}`).set(val === undefined ? null : val); } catch(e) {}
};
const fbListen = (key, cb) => {
  if (!fbDB) return () => {};
  const ref = fbDB.ref(`${FB_PATH}/${key}`);
  const handler = snap => cb(snap.val());
  ref.on('value', handler);
  return () => ref.off('value', handler);
};

/* ─── HELPERS ─────────────────────────────────────────────────── */
const uid = () => Date.now().toString(36) + Math.random().toString(36).substr(2,5);
const inr = n => '₹' + Number(n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtDate = d => { try { return new Date(d).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}); } catch{return d;} };
const monthKey = d => (d||'').substring(0,7);
const monthLabel = k => { const [y,m] = (k||'').split('-'); if(!y||!m) return k; return new Date(y,m-1).toLocaleString('en-IN',{month:'long',year:'numeric'}); };
const genQR = (text) => {
  try {
    const qr = qrcode(0,'M');
    qr.addData(text);
    qr.make();
    return qr.createDataURL(4,0);
  } catch { return ''; }
};
const upiUrl = (upiId, name, amount, note) =>
  `upi://pay?pa=${encodeURIComponent(upiId)}&pn=${encodeURIComponent(name)}&am=${Number(amount).toFixed(2)}&cu=INR&tn=${encodeURIComponent(note||'Ration Expense')}`;

/* ─── SVG ICONS ─────────────────────────────────────────────────── */

    card: 'M1 4h22v16H1zM1 10h22',
    cog: 'M12 15a3 3 0 100-6 3 3 0 000 6z',
    out: 'M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9',
    bell2: 'M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 01-3.46 0',
    trash2: 'M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a1 1 0 011-1h4a1 1 0 011 1v2',
    pen: 'M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z',
    x2: 'M18 6L6 18M6 6l12 12',
    dl: 'M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3',
    srch: 'M21 21l-4.35-4.35M17 11A6 6 0 105 11a6 6 0 0012 0z',

    eye: 'M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8zM12 15a3 3 0 100-6 3 3 0 000 6z',
    img: 'M21 19V5a2 2 0 00-2-2H5a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2zM8.5 10a1.5 1.5 0 100-3 1.5 1.5 0 000 3zM21 15l-5-5L5 21',
    pencil: 'M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z',
  };
  return (
    <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round" className={c}>
      {(d[n]||'').split('M').filter(Boolean).map((path,i) => (
        path.includes('z') || path.includes('Z')
          ? <path key={i} d={'M'+path} fillRule="evenodd" />
          : <path key={i} d={'M'+path} />
      ))}
    </svg>
  );
};

/* ─── PRIMITIVE COMPONENTS ─────────────────────────────────────── */
const Btn = ({ onClick, children, v='primary', sz='md', cls='', disabled=false, type='button' }) => {
  const base = 'inline-flex items-center gap-1.5 font-medium rounded-xl transition-all duration-150 cursor-pointer select-none';
  const sizes = { xs:'px-2.5 py-1.5 text-xs', sm:'px-3.5 py-2 text-xs', md:'px-4 py-2.5 text-sm', lg:'px-6 py-3.5 text-sm' };
  const vars = {
    primary: 'btn-primary text-white',
    ghost: 'bg-transparent hover:bg-white/8 text-white/60 hover:text-white',
    sec: 'bg-white/6 hover:bg-white/10 text-white/70 hover:text-white border border-white/10',
    danger: 'bg-red-600/20 hover:bg-red-500/30 text-red-400 border border-red-500/25',
    success: 'bg-emerald-600/20 hover:bg-emerald-500/30 text-emerald-400 border border-emerald-500/25',
    warn: 'bg-yellow-600/20 hover:bg-yellow-500/30 text-yellow-400 border border-yellow-500/25',
  };
  return (
    <button type={type} onClick={onClick} disabled={disabled}
      className={`${base} ${sizes[sz]} ${vars[v]} ${cls} ${disabled ? 'opacity-40 cursor-not-allowed' : ''}`}>
      {children}
    </button>
  );
};

const Inp = ({ label, value, onChange, type='text', ph='', req=false, cls='', min, max, step, readOnly=false }) => (
  <div className={`space-y-1.5 ${cls}`}>
    {label && <label className="block text-xs text-white/40 font-medium tracking-wide uppercase">{label}{req && <span className="text-violet-400 ml-0.5">*</span>}</label>}
    <input type={type} value={value} onChange={e=>onChange(e.target.value)} placeholder={ph} required={req}
      min={min} max={max} step={step} readOnly={readOnly}
      className="input-field w-full rounded-xl px-3.5 py-2.5 text-sm transition-all duration-150 focus:ring-2"
    />
  </div>
);

const Sel = ({ label, value, onChange, opts, cls='' }) => (
  <div className={`space-y-1.5 ${cls}`}>
    {label && <label className="block text-xs text-white/40 font-medium tracking-wide uppercase">{label}</label>}
    <select value={value} onChange={e=>onChange(e.target.value)}
      className="input-field w-full rounded-xl px-3.5 py-2.5 text-sm transition-all appearance-none cursor-pointer">
      {opts.map(o=><option key={o.v||o} value={o.v||o}>{o.l||o}</option>)}
    </select>
  </div>
);

const Tag = ({ children, t='gray' }) => (
  <span className={`inline-flex items-center gap-1 px-2.5 py-1 rounded-lg text-xs font-medium tag-${t}`}>{children}</span>
);

const Card = ({ children, cls='', onClick }) => (
  <div className={`glass rounded-2xl p-5 ${cls} ${onClick ? 'cursor-pointer hover:bg-white/5 transition-all' : ''}`} onClick={onClick}>{children}</div>
);

const Modal = ({ open, onClose, title, children, w='max-w-md' }) => {
  if (!open) return null;
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4 modal-bg" onClick={onClose}>
      <div className={`relative ${w} w-full glass-strong rounded-2xl p-6 modal-panel max-h-[92vh] overflow-y-auto`} onClick={e=>e.stopPropagation()}>
        <div className="flex items-center justify-between mb-5">
          <h3 className="text-base font-semibold text-white">{title}</h3>
          <button onClick={onClose} className="w-7 h-7 rounded-lg flex items-center justify-center text-white/40 hover:text-white hover:bg-white/10 transition-all">
            <IC n="x2" s={14}/>
          </button>
        </div>
        {children}
      </div>

};

const StatCard = ({ label, val, icon, t='purple', sub, trend }) => {
  const cs = { purple:'text-violet-400', green:'text-emerald-400', yellow:'text-amber-400', red:'text-red-400', blue:'text-blue-400' };
  const bgs = { purple:'bg-violet-500/12', green:'bg-emerald-500/12', yellow:'bg-amber-500/12', red:'bg-red-500/12', blue:'bg-blue-500/12' };
  return (
    <Card cls="stat-shimmer fade-up">
      <div className="flex items-start justify-between">
        <div className="flex-1 min-w-0">
          <p className="text-xs text-white/35 font-medium uppercase tracking-wider mb-2">{label}</p>
          <p className="text-2xl font-bold text-white leading-none">{val}</p>
          {sub && <p className="text-xs text-white/35 mt-1.5">{sub}</p>}
        </div>
        <div className={`w-10 h-10 rounded-xl flex items-center justify-center flex-shrink-0 ${bgs[t]} ${cs[t]}`}>
          <IC n={icon} s={18}/>
        </div>

};

/* ─── AUTH PAGE ─────────────────────────────────────────────────── */
const AuthPage = ({ onLogin }) => {
  const [mode, setMode] = useState('login');
  const [email, setEmail] = useState('');
  const [pw, setPw] = useState('');
  const [name, setName] = useState('');
  const [err, setErr] = useState('');
  const [loading, setLoading] = useState(false);

  const submit = () => {
    setErr(''); setLoading(true);
    // Read current users from Firebase for auth
    (fbDB ? fbDB.ref(`${FB_PATH}/users`).once('value') : Promise.resolve({ val: () => null }))
      .then(snap => {
        setLoading(false);
        const users = snap.val() || [OWNER];
        if (mode === 'login') {
          const u = users.find(x => x.email === email.trim().toLowerCase() && x.password === pw);
          if (!u) { setErr('Invalid email or password'); return; }
          session.set(u);
          onLogin(u);
        } else {
          if (!name || !email || !pw) { setErr('All fields required'); return; }
          if (pw.length < 6) { setErr('Password min 6 characters'); return; }
          if (users.find(u => u.email === email.trim().toLowerCase())) { setErr('Email already registered'); return; }
          const nu = { id: uid(), name: name.trim(), email: email.trim().toLowerCase(), password: pw, role: 'viewer', createdAt: new Date().toISOString() };
          fbSet('users', [...users, nu]);
          session.set(nu);
          onLogin(nu);
        }
      })
      .catch(() => { setLoading(false); setErr('Connection error. Check Firebase config.'); });
  };

  return (
    <div className="min-h-screen flex items-center justify-center p-4" style={{background:'radial-gradient(ellipse 80% 60% at 20% -10%, rgba(124,58,237,0.18) 0%, transparent 60%), radial-gradient(ellipse 60% 40% at 80% 110%, rgba(79,70,229,0.12) 0%, transparent 50%), #07070a'}}>
      <div className="w-full max-w-sm fade-up">
        <div className="text-center mb-8">
          <div className="inline-flex items-center justify-center w-14 h-14 rounded-2xl btn-primary mb-4">
            <IC n="list2" s={24} c="text-white"/>
          </div>
          <h1 className="text-2xl font-bold text-white tracking-tight">RationTrack</h1>
          <p className="text-sm text-white/35 mt-1">Household Expense Management</p>
        </div>

        <Card cls="glow-purple">
          <div className="flex bg-white/5 rounded-xl p-1 mb-5 gap-1">
            {['login','signup'].map(m=>(
              <button key={m} onClick={()=>{setMode(m);setErr('');}}
                className={`flex-1 py-2.5 text-sm font-medium rounded-lg transition-all ${mode===m ? 'btn-primary text-white' : 'text-white/40 hover:text-white/70'}`}>
                {m==='login' ? '← Login' : 'Sign Up →'}
              </button>
            ))}
          </div>

          <div className="space-y-3.5">
            {mode==='signup' && <Inp label="Full Name" value={name} onChange={setName} ph="Abhinandan Kumar Singh" req />}
            <Inp label="Email Address" value={email} onChange={setEmail} type="email" ph="you@example.com" req />
            <Inp label="Password" value={pw} onChange={setPw} type="password" ph="••••••••" req />
            {err && (
              <div className="flex items-center gap-2 px-3 py-2.5 bg-red-500/10 border border-red-500/20 rounded-xl text-xs text-red-400">
                <IC n="info" s={13}/> {err}
              </div>
            )}
            <Btn onClick={submit} disabled={loading} cls="w-full justify-center" sz="lg">
              {loading ? 'Please wait...' : mode==='login' ? 'Login to Dashboard' : 'Create Account'}
            </Btn>
          </div>


        </Card>

        <p className="text-center text-xs text-white/20 mt-5">New accounts are assigned Viewer role by default</p>
      </div>
    </div>
  );
};

/* ─── SIDEBAR ─────────────────────────────────────────────────────── */

              <IC n="list2" s={15} c="text-white"/>
            </div>
            <div>
              <span className="text-sm font-bold text-white leading-none block">RationTrack</span>
              <span className="text-xs text-white/30">v2.0</span>
            </div>
          </div>
        </div>

        {/* Nav */}

/* ─── TOPBAR ─────────────────────────────────────────────────────── */
const Topbar = ({ title, user, notifs, onMarkRead, openSidebar, lastSync }) => {
  const [showN, setShowN] = useState(false);
  const [syncAgo, setSyncAgo] = useState('');
  const [syncing, setSyncing] = useState(false);
  const unread = notifs.filter(n=>!n.read).length;
  const ref = useRef();

  useEffect(() => {
    const h = e => { if(ref.current && !ref.current.contains(e.target)) setShowN(false); };
    document.addEventListener('mousedown', h);
    return () => document.removeEventListener('mousedown', h);
  },[]);

  // Update "X sec ago" text every second
  useEffect(() => {
    if (!lastSync) return;
    setSyncing(true);
    setTimeout(() => setSyncing(false), 1000);
    const tick = () => {
      const diff = Math.floor((Date.now() - lastSync.getTime()) / 1000);
      if (diff < 60) setSyncAgo(diff <= 3 ? 'abhi' : `${diff}s pehle`);
      else setSyncAgo(`${Math.floor(diff/60)}m pehle`);
    };
    tick();
    const t = setInterval(tick, 5000);
    return () => clearInterval(t);
  }, [lastSync]);

  return (
    <header className="h-14 flex items-center justify-between px-4 lg:px-6 border-b border-white/6 sticky top-0 z-20"
      style={{background:'rgba(8,7,12,0.95)', backdropFilter:'blur(20px)'}}>
      <div className="flex items-center gap-3">
        <button onClick={openSidebar} className="lg:hidden w-8 h-8 flex items-center justify-center rounded-lg text-white/50 hover:text-white hover:bg-white/8 transition-all">
          <IC n="menu2" s={18}/>
        </button>
        <h1 className="text-sm font-semibold text-white">{title}</h1>
        {lastSync && (
          <div className={`hidden sm:flex items-center gap-1.5 px-2.5 py-1 rounded-lg border transition-all duration-500 ${syncing ? 'border-emerald-500/40 bg-emerald-500/10' : 'border-white/6 bg-white/3'}`}>
            <span className={`w-1.5 h-1.5 rounded-full transition-all duration-500 ${syncing ? 'bg-emerald-400' : 'bg-white/20'}`}
              style={syncing ? {boxShadow:'0 0 6px #34d399'} : {}}/>
            <span className={`text-xs transition-all duration-500 ${syncing ? 'text-emerald-400' : 'text-white/25'}`}>
              {syncing ? 'Sync ho raha hai...' : `Synced: ${syncAgo}`}
            </span>
          </div>
        )}
      </div>
      <div className="flex items-center gap-1.5" ref={ref}>
        <div className="relative">
          <button onClick={()=>setShowN(!showN)} className="w-8 h-8 flex items-center justify-center rounded-lg text-white/50 hover:text-white hover:bg-white/8 transition-all relative">
            <IC n="bell2" s={16}/>
            {unread > 0 && <span className="absolute top-1 right-1 w-2 h-2 bg-violet-500 rounded-full notification-dot"/>}
          </button>
          {showN && (
            <div className="absolute right-0 top-11 w-76 glass-strong rounded-2xl p-3 shadow-2xl z-50 fade-up" style={{width:'300px'}}>
              <div className="flex justify-between items-center mb-3">
                <span className="text-xs font-semibold text-white/70">Notifications</span>
                <button onClick={()=>{onMarkRead();setShowN(false);}} className="text-xs text-violet-400 hover:text-violet-300 transition-all">Clear all</button>
              </div>
              <div className="space-y-1.5 max-h-60 overflow-y-auto">
                {notifs.length===0 ? (
                  <p className="text-xs text-white/25 text-center py-6">All caught up!</p>
                ) : notifs.slice(0,12).map(n=>(
                  <div key={n.id} className={`px-3 py-2.5 rounded-xl text-xs ${n.read?'bg-white/3 text-white/35':'bg-violet-500/10 text-white/65 border border-violet-500/15'}`}>
                    <p>{n.message}</p>
                    <p className="text-white/25 mt-1">{fmtDate(n.createdAt)}</p>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
        <div className="w-7 h-7 rounded-full btn-primary flex items-center justify-center text-xs font-bold text-white ml-1">
          {user.name.charAt(0)}
        </div>
      </div>
    </header>
  );
};

/* ─── DASHBOARD ─────────────────────────────────────────────────── */
const Dashboard = ({ entries, pending, payments, user, members, lastSync }) => {
  const splitNames = (members||DEFAULT_MEMBERS).map(m=>m.name);
  const splitCount = splitNames.length;
  const approved = entries.filter(e=>e.status==='approved');
  const now = monthKey(new Date().toISOString());
  const thisMonth = approved.filter(e=>monthKey(e.date)===now);
  const total = thisMonth.reduce((s,e)=>s+e.price,0);
  const perP = total/splitCount;

  const [syncLabel, setSyncLabel] = useState('');
  useEffect(() => {
    if (!lastSync) return;
    const tick = () => {
      const diff = Math.floor((Date.now() - lastSync.getTime()) / 1000);
      const next = 30 - (diff % 30);
      if (diff < 5) setSyncLabel('Abhi sync hua ✓');
      else setSyncLabel(`Last sync: ${diff < 60 ? diff+'s' : Math.floor(diff/60)+'m'} pehle · Next: ${next}s mein`);
    };
    tick();
    const t = setInterval(tick, 1000);
    return () => clearInterval(t);
  }, [lastSync]);

  // 6-month chart data
  const months6 = Array.from({length:6},(_,i)=>{
    const d=new Date(); d.setMonth(d.getMonth()-5+i);
    const k=monthKey(d.toISOString());
    return { k, label:d.toLocaleString('en-IN',{month:'short'}), total:approved.filter(e=>monthKey(e.date)===k).reduce((s,e)=>s+e.price,0) };
  });
  const maxM = Math.max(...months6.map(m=>m.total),1);

  const pendingN = pending.filter(p=>p.status==='pending').length;
  const allTotal = approved.reduce((s,e)=>s+e.price,0);
  const recent = [...approved].sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)).slice(0,5);

  return (
    <div className="space-y-5 fade-up">
      {/* Sync status bar */}
      {lastSync && (
        <div className="flex items-center justify-between px-4 py-2.5 rounded-xl bg-white/3 border border-white/6">
          <div className="flex items-center gap-2">
            <span className="w-2 h-2 rounded-full bg-emerald-400" style={{boxShadow:'0 0 6px #34d399'}}/>
            <span className="text-xs text-white/50">🔄 {syncLabel || 'Sync chal raha hai...'}</span>
          </div>
          <span className="text-xs text-white/25 font-mono">{lastSync.toLocaleTimeString('en-IN')}</span>
        </div>
      )}
      {/* Stats row */}
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
        <StatCard label="This Month" val={inr(total)} icon="ru" t="purple" sub={monthLabel(now)}/>
        <StatCard label="Per Person" val={inr(perP)} icon="usr" t="blue" sub={`÷ ${splitCount} people`}/>
        <StatCard label="Total Entries" val={approved.length} icon="list2" t="green"/>
        {user.role!=='viewer'
          ? <StatCard label="Pending Approval" val={pendingN} icon="tick" t={pendingN>0?'yellow':'green'}/>
          : <StatCard label="All Time Total" val={inr(allTotal)} icon="ru" t="yellow"/>
        }
      </div>

      {/* Chart + Recent */}
      <div className="grid lg:grid-cols-5 gap-4">
        <Card cls="lg:col-span-3">
          <div className="flex items-center justify-between mb-4">
            <h3 className="text-sm font-semibold text-white">Monthly Expenses</h3>
            <Tag t="gray">Last 6 months</Tag>
          </div>
          <div className="flex items-end gap-2 h-32">
            {months6.map((m,i)=>(
              <div key={i} className="flex-1 flex flex-col items-center gap-1.5 group">
                <span className="text-xs text-white/25 font-mono opacity-0 group-hover:opacity-100 transition-all">{m.total>0?'₹'+Math.round(m.total/1000)+'k':''}</span>
                <div className="w-full rounded-t-lg transition-all duration-500 ease-out"
                  style={{height:`${Math.max((m.total/maxM)*100,m.total>0?4:2)}%`,background:m.k===now?'rgba(139,92,246,0.85)':'rgba(124,58,237,0.28)',minHeight:'4px'}}/>
                <span className="text-xs text-white/35">{m.label}</span>
              </div>
            ))}
          </div>
        </Card>
        <Card cls="lg:col-span-2">
          <h3 className="text-sm font-semibold text-white mb-4">Recent Entries</h3>
          <div className="space-y-0.5">
            {recent.length===0 ? <p className="text-xs text-white/25 text-center py-6">No entries yet</p>
            : recent.map(e=>(
              <div key={e.id} className="flex items-center justify-between py-2.5 border-b border-white/4 last:border-0">
                <div className="min-w-0 mr-2">
                  <p className="text-sm text-white truncate">{e.itemName}</p>
                  <p className="text-xs text-white/30">{fmtDate(e.date)}</p>
                </div>
                <span className="text-sm font-medium text-violet-400 flex-shrink-0">{inr(e.price)}</span>
              </div>
            ))}
          </div>
        </Card>
      </div>

      {/* Split card */}
      <Card>
        <div className="flex items-center justify-between mb-4">
          <h3 className="text-sm font-semibold text-white">Split This Month</h3>
          <span className="text-xs text-white/35">{monthLabel(now)} · {inr(total)} ÷ {splitCount}</span>
        </div>
        <div className={`grid gap-3 ${splitCount<=2?'grid-cols-2':splitCount===3?'grid-cols-3':'grid-cols-2 lg:grid-cols-4'}`}>
          {splitNames.map((name,i)=>(
            <div key={i} className="flex flex-col items-center gap-2.5 p-4 rounded-xl bg-white/3 border border-white/6">
              <div className="w-10 h-10 rounded-full btn-primary flex items-center justify-center text-sm font-bold text-white">{name.charAt(0)}</div>
              <div className="text-center">
                <p className="text-xs text-white/35 truncate w-full">{name.split(' ')[0]}</p>
                <p className="text-base font-bold text-white mt-0.5">{inr(perP)}</p>
              </div>
              {(() => {
                const paid = payments.find(p=>p.month===now && p.userName===name);
                return paid?.status==='paid'
                  ? <Tag t="green">✓ Paid</Tag>
                  : <Tag t="yellow">Pending</Tag>;
              })()}
            </div>
          ))}
        </div>
      </Card>

      {/* Top items */}
      {thisMonth.length > 0 && (
        <Card>
          <h3 className="text-sm font-semibold text-white mb-4">Top Expenses This Month</h3>
          <div className="space-y-2">
            {[...thisMonth].sort((a,b)=>b.price-a.price).slice(0,5).map((e,i)=>(
              <div key={e.id} className="flex items-center gap-3">
                <span className="text-xs text-white/25 w-4 flex-shrink-0 font-mono">{i+1}</span>
                <div className="flex-1 min-w-0">
                  <div className="flex items-center justify-between mb-1">
                    <span className="text-sm text-white/80">{e.itemName}</span>
                    <span className="text-xs font-medium text-white/60">{inr(e.price)}</span>
                  </div>
                  <div className="h-1 bg-white/6 rounded-full overflow-hidden">
                    <div className="h-full rounded-full" style={{width:`${(e.price/thisMonth[0]?.price)*100}%`,background:'rgba(124,58,237,0.7)'}}/>
                  </div>
                </div>
              </div>
            ))}
          </div>
        </Card>
      )}
    </div>
  );
};

/* ─── ADD ENTRY ─────────────────────────────────────────────────── */
const AddEntry = ({ user, onAdd, addNotif }) => {
  const emptyRow = () => ({ id:uid(), itemName:'', qty:'', unit:'kg', price:'', date:new Date().toISOString().substring(0,10) });
  const [rows, setRows] = useState([emptyRow()]);
  const [bulk, setBulk] = useState(false);
  const [done, setDone] = useState('');

  const upd = (id, f, v) => setRows(r => r.map(x => x.id===id ? {...x,[f]:v} : x));
  const addRow = () => setRows(r=>[...r, emptyRow()]);
  const rmRow = id => setRows(r=>r.filter(x=>x.id!==id));

  const submit = () => {
    if (rows.some(r=>!r.itemName||!r.price||!r.date)) { alert('Fill all required fields'); return; }
    const newEntries = rows.map(r=>({
      id:uid(), itemName:r.itemName.trim(), quantity:parseFloat(r.qty)||0, unit:r.unit,
      price:parseFloat(r.price), date:r.date,
      addedBy:user.id, addedByName:user.name,
      status: user.role==='owner' ? 'approved' : 'pending',
      createdAt:new Date().toISOString()
    }));
    onAdd(newEntries);
    setRows([emptyRow()]);
    const msg = user.role==='owner' ? `${newEntries.length} entr${newEntries.length>1?'ies':'y'} added!` : `Submitted for approval`;
    setDone(msg);
    if (user.role!=='owner') addNotif(`${user.name} submitted ${newEntries.length} ration entr${newEntries.length>1?'ies':'y'} for approval`);
    setTimeout(()=>setDone(''),3000);
  };

  return (
    <div className="max-w-3xl space-y-4 fade-up">
      <div className="flex items-center justify-between">
        <div>
          <h2 className="text-base font-semibold text-white">Add Ration Items</h2>
          <p className="text-xs text-white/35 mt-0.5">
            {user.role!=='owner' ? '⚠ Changes go to owner for approval' : '✓ Items added directly as owner'}
          </p>
        </div>
        <label className="flex items-center gap-2 cursor-pointer select-none">
          <span className="text-xs text-white/40">Bulk mode</span>
          <div className="relative" onClick={()=>setBulk(b=>!b)}>
            <div className={`w-10 h-5 rounded-full transition-all ${bulk?'bg-violet-600':'bg-white/12'}`}/>
            <div className={`absolute top-0.5 w-4 h-4 bg-white rounded-full shadow transition-all ${bulk?'left-5.5':'left-0.5'}`} style={{left:bulk?'22px':'2px'}}/>
          </div>
        </label>
      </div>

      {done && (
        <div className="flex items-center gap-2 px-4 py-3 bg-emerald-500/10 border border-emerald-500/20 rounded-xl text-sm text-emerald-400">
          <IC n="tick" s={16}/> {done}
        </div>
      )}

      <Card>
        <div className="space-y-4">
          {rows.map((row,i)=>(
            <div key={row.id} className={bulk && rows.length>1 ? 'p-4 bg-white/3 rounded-xl border border-white/6 space-y-3 relative' : 'space-y-0'}>
              {bulk && rows.length>1 && (
                <div className="flex items-center justify-between">
                  <span className="text-xs text-white/30 font-mono">Item #{i+1}</span>
                  <button onClick={()=>rmRow(row.id)} className="w-6 h-6 flex items-center justify-center rounded-lg text-white/25 hover:text-red-400 hover:bg-red-500/10 transition-all">
                    <IC n="x2" s={12}/>
                  </button>
                </div>
              )}
              <div className={`grid gap-3 ${bulk ? 'grid-cols-2 lg:grid-cols-5' : 'grid-cols-2 lg:grid-cols-5'}`}>
                <Inp label="Item Name" value={row.itemName} onChange={v=>upd(row.id,'itemName',v)} ph="Rice, Oil…" req cls="col-span-2 lg:col-span-1"/>
                <Inp label="Quantity" value={row.qty} onChange={v=>upd(row.id,'qty',v)} type="number" ph="5" min="0" step="0.01"/>
                <Sel label="Unit" value={row.unit} onChange={v=>upd(row.id,'unit',v)} opts={UNITS}/>
                <Inp label="Price ₹" value={row.price} onChange={v=>upd(row.id,'price',v)} type="number" ph="500" min="0" step="0.01" req/>
                <Inp label="Date" value={row.date} onChange={v=>upd(row.id,'date',v)} type="date" req/>
              </div>
            </div>
          ))}

          {bulk && (
            <button onClick={addRow} className="w-full py-3 border border-dashed border-white/12 rounded-xl text-sm text-white/30 hover:text-white/60 hover:border-white/25 transition-all flex items-center justify-center gap-2">
              <IC n="plus2" s={14}/> Add Another Item
            </button>
          )}
        </div>

        <div className="flex items-center justify-between mt-5 pt-4 border-t border-white/6">
          <span className="text-xs text-white/30">{rows.length} item{rows.length>1?'s':''} · Est. total: {inr(rows.reduce((s,r)=>s+(parseFloat(r.price)||0),0))}</span>
          <Btn onClick={submit} sz="lg">
            <IC n="tick" s={15}/> {rows.length>1 ? `Submit ${rows.length} Items` : 'Add Entry'}
          </Btn>
        </div>
      </Card>
    </div>
  );
};

/* ─── ALL ENTRIES ─────────────────────────────────────────────────── */

    const ms = e.itemName.toLowerCase().includes(search.toLowerCase()) || (e.addedByName||'').toLowerCase().includes(search.toLowerCase());

                          <button onClick={()=>{if(confirm('Delete this entry?'))onDelete(e.id);}} className="w-7 h-7 flex items-center justify-center rounded-lg text-white/25 hover:text-red-400 hover:bg-red-500/10 transition-all">
                            <IC n="trash2" s={13}/>
                          </button>
                        </div>
                      </td>
                    )}
                  </tr>
                ))
              }
            </tbody>
          </table>
        </div>
        <div className="px-4 py-3 border-t border-white/5 flex items-center justify-between">
          <span className="text-xs text-white/25">{filtered.length} entries found</span>
          <span className="text-xs font-semibold text-violet-400">Approved total: {inr(totalApproved)}</span>
        </div>
      </Card>

      {/* Edit modal */}
      {editE && (
        <Modal open title="Edit Entry" onClose={()=>setEditE(null)}>
          <EditForm entry={editE} user={user} onSave={u=>{onEdit(u);setEditE(null);}} onClose={()=>setEditE(null)}/>
        </Modal>
      )}
    </div>
  );
};

const EditForm = ({ entry, user, onSave, onClose }) => {
  const [f, setF] = useState({...entry});
  return (
    <div className="space-y-3.5">
      <Inp label="Item Name" value={f.itemName} onChange={v=>setF({...f,itemName:v})} req/>
      <div className="grid grid-cols-2 gap-3">
        <Inp label="Quantity" value={f.quantity} onChange={v=>setF({...f,quantity:v})} type="number" min="0" step="0.01"/>
        <Sel label="Unit" value={f.unit} onChange={v=>setF({...f,unit:v})} opts={UNITS}/>
      </div>
      <Inp label="Price (₹)" value={f.price} onChange={v=>setF({...f,price:v})} type="number" min="0" step="0.01" req/>
      <Inp label="Date" value={f.date} onChange={v=>setF({...f,date:v})} type="date" req/>
      <div className="flex gap-2 pt-1">
        <Btn onClick={onClose} v="sec" cls="flex-1 justify-center">Cancel</Btn>
        <Btn onClick={()=>onSave({...f,price:parseFloat(f.price),quantity:parseFloat(f.quantity)||0})} cls="flex-1 justify-center">
          {user.role==='owner' ? 'Save Changes' : 'Submit for Approval'}
        </Btn>
      </div>
    </div>
  );
};

/* ─── APPROVALS ─────────────────────────────────────────────────── */
const Approvals = ({ pending, onApprove, onReject, user }) => {
  const waiting = pending.filter(c=>c.status==='pending');
  const history = [...pending.filter(c=>c.status!=='pending')].reverse().slice(0,30);

  if (user.role==='viewer') return (
    <div className="flex flex-col items-center justify-center py-16 text-white/25">
      <IC n="tick" s={48} c="opacity-20 mb-4"/>
      <p>Approvals page is for admins and owners only</p>
    </div>
  );

  return (
    <div className="space-y-5 fade-up">
      <Card>
        <div className="flex items-center justify-between mb-4">
          <div>
            <h3 className="text-sm font-semibold text-white">Pending Approvals</h3>
            <p className="text-xs text-white/35 mt-0.5">Review changes submitted by admins</p>
          </div>
          <Tag t={waiting.length>0?'yellow':'green'}>{waiting.length} waiting</Tag>
        </div>

        {waiting.length===0 ? (
          <div className="text-center py-10">
            <IC n="tick" s={40} c="text-emerald-500/30 mx-auto mb-3 block"/>
            <p className="text-sm text-white/30">All clear — no pending approvals</p>
          </div>
        ) : (
          <div className="space-y-3">
            {waiting.map(chg=>{
              const items = chg.entries || (chg.entryData ? [chg.entryData] : []);
              const total = items.reduce((s,e)=>s+(e.price||0),0);
              return (
                <div key={chg.id} className="p-4 bg-amber-500/5 border border-amber-500/15 rounded-xl">
                  <div className="flex items-start justify-between gap-3">
                    <div className="flex-1 min-w-0">
                      <div className="flex items-center flex-wrap gap-2 mb-2">
                        <Tag t={chg.type==='add'?'green':chg.type==='edit'?'blue':'red'}>{chg.type.toUpperCase()}</Tag>
                        <span className="text-xs text-white/45">by <strong className="text-white/65">{chg.requestedByName}</strong></span>
                        <span className="text-xs text-white/30">{fmtDate(chg.requestedAt)}</span>
                      </div>
                      <div className="space-y-1">
                        {items.map((e,i)=>(
                          <p key={i} className="text-sm text-white/80">
                            <strong className="text-white">{e.itemName}</strong> — {inr(e.price)} on {fmtDate(e.date)}
                            {e.quantity>0 && <span className="text-white/40 text-xs ml-1">({e.quantity} {e.unit})</span>}
                          </p>
                        ))}
                      </div>
                      {items.length > 1 && <p className="text-xs text-violet-400 mt-1.5">Total: {inr(total)}</p>}
                    </div>
                    <div className="flex gap-2 flex-shrink-0">
                      <Btn onClick={()=>onReject(chg.id)} v="danger" sz="sm">✕ Reject</Btn>
                      <Btn onClick={()=>onApprove(chg.id)} v="success" sz="sm">✓ Approve</Btn>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </Card>

      {history.length > 0 && (
        <Card>
          <h3 className="text-sm font-semibold text-white mb-4">Recent History</h3>
          <div className="space-y-0">
            {history.map(chg=>{
              const items = chg.entries || (chg.entryData ? [chg.entryData] : []);
              return (
                <div key={chg.id} className="flex items-center justify-between py-3 border-b border-white/4 last:border-0">
                  <div className="flex items-center gap-3 min-w-0 flex-1 mr-4">
                    <Tag t={chg.status==='approved'?'green':'red'}>{chg.status}</Tag>
                    <div className="min-w-0">
                      <p className="text-sm text-white/70 truncate">{items.map(e=>e.itemName).join(', ')}</p>
                      <p className="text-xs text-white/30 mt-0.5">{chg.requestedByName} · {fmtDate(chg.requestedAt)}</p>
                    </div>
                  </div>
                  <span className="text-sm text-white/50 flex-shrink-0">{inr(items.reduce((s,e)=>s+e.price,0))}</span>
                </div>
              );
            })}
          </div>
        </Card>
      )}
    </div>
  );
};

/* ─── REPORTS ─────────────────────────────────────────────────── */
const Reports = ({ entries, members }) => {
  const splitNames = (members||DEFAULT_MEMBERS).map(m=>m.name);
  const splitCount = splitNames.length;
  const approved = entries.filter(e=>e.status==='approved');
  const monthMap = {};
  approved.forEach(e=>{
    const k=monthKey(e.date);
    if(!monthMap[k]) monthMap[k]=[];
    monthMap[k].push(e);
  });
  const sortedMonths = Object.keys(monthMap).sort().reverse();
  const now = monthKey(new Date().toISOString());
  const [selMonth, setSelMonth] = useState(sortedMonths[0]||now);
  const [downloading, setDownloading] = useState('');

  const data = monthMap[selMonth]||[];
  const total = data.reduce((s,e)=>s+e.price,0);
  const perP = splitCount>0 ? total/splitCount : 0;

  // Category-wise breakdown
  const catMap = {};
  data.forEach(e=>{
    const cat = e.itemName.trim();
    catMap[cat] = (catMap[cat]||0)+e.price;
  });
  const topItems = Object.entries(catMap).sort((a,b)=>b[1]-a[1]).slice(0,5);

  const csvExport = () => {
    setDownloading('csv');
    setTimeout(()=>{
      const rows = [
        ['RationTrack - Monthly Report'],
        [`Month: ${monthLabel(selMonth)}`],
        [`Generated: ${new Date().toLocaleDateString('en-IN')}`],
        [],
        ['#','Item Name','Quantity','Unit','Price (Rs)','Date','Added By'],
        ...data.map((e,i)=>[i+1, e.itemName, e.quantity, e.unit, e.price, e.date, e.addedByName||'']),
        [],
        ['','','','','','',''],
        ['SUMMARY','','','','','',''],
        ['Total Expense','','','', total.toFixed(2),'',''],
        [`Per Person (÷${splitCount})`,'','','', perP.toFixed(2),'',''],
        [],
        ['MEMBER SPLIT','','','','','',''],
        ...splitNames.map((n,i)=>[i+1, n,'','', perP.toFixed(2),'','']),
      ];
      const csv = rows.map(r=>Array.isArray(r)?r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(','):'').join('\n');
      const a = document.createElement('a');
      a.href = 'data:text/csv;charset=utf-8,\uFEFF' + encodeURIComponent(csv);
      a.download = `RationTrack-${selMonth}.csv`;
      a.click();
      setDownloading('');
    }, 400);
  };

  const pdfExport = () => {
    setDownloading('pdf');
    setTimeout(()=>{
      try {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ orientation:'portrait', unit:'mm', format:'a4' });
        const W=210, margin=18;

        // Background
        doc.setFillColor(7,7,10);
        doc.rect(0,0,W,297,'F');

        // Header gradient bar
        doc.setFillColor(80,40,160);
        doc.rect(0,0,W,2,'F');

        // Title
        doc.setTextColor(200,185,255);
        doc.setFontSize(24);
        doc.setFont('helvetica','bold');
        doc.text('RationTrack',margin,20);
        doc.setFontSize(11);
        doc.setFont('helvetica','normal');
        doc.setTextColor(130,115,200);
        doc.text('Monthly Expense Report',margin,28);

        // Month badge box
        doc.setFillColor(50,30,100);
        doc.setDrawColor(80,55,160);
        doc.setLineWidth(0.4);
        doc.roundedRect(margin,33, W-margin*2, 14, 3,3,'FD');
        doc.setTextColor(170,150,255);
        doc.setFontSize(13);
        doc.setFont('helvetica','bold');
        doc.text(monthLabel(selMonth), margin+6, 42);
        doc.setFont('helvetica','normal');
        doc.setFontSize(9);
        doc.setTextColor(110,95,165);
        doc.text(`${data.length} items  |  Generated: ${new Date().toLocaleDateString('en-IN')}  |  ${OWNER.name}`, margin+6, 42);

        // Re-draw month label properly
        doc.setTextColor(200,180,255);
        doc.setFontSize(13);
        doc.setFont('helvetica','bold');
        doc.text(monthLabel(selMonth), margin+6, 40);
        doc.setFont('helvetica','normal');
        doc.setFontSize(8);
        doc.setTextColor(120,105,175);
        doc.text(`${data.length} items  ·  Generated on ${new Date().toLocaleDateString('en-IN')}`, margin+6, 45);

        // Summary cards row
        let sy = 56;
        const cards = [
          { label:'Total Expense', val:'Rs '+total.toFixed(2), color:[80,40,160] },
          { label:`Per Person (÷${splitCount})`, val:'Rs '+perP.toFixed(2), color:[30,100,80] },
          { label:'Total Items', val:String(data.length), color:[100,60,30] },
        ];
        const cardW = (W - margin*2 - 8) / 3;
        cards.forEach((c,i)=>{
          const x = margin + i*(cardW+4);
          doc.setFillColor(...c.color, 0.6);
          doc.setFillColor(c.color[0], c.color[1], c.color[2]);
          doc.setDrawColor(c.color[0]+30, c.color[1]+20, c.color[2]+40);
          doc.setLineWidth(0.3);
          doc.roundedRect(x, sy, cardW, 18, 2,2,'FD');
          doc.setTextColor(180,165,240);
          doc.setFontSize(7);
          doc.setFont('helvetica','normal');
          doc.text(c.label, x+4, sy+7);
          doc.setTextColor(230,220,255);
          doc.setFontSize(11);
          doc.setFont('helvetica','bold');
          doc.text(c.val, x+4, sy+15);
        });

        // Split row
        sy += 24;
        doc.setTextColor(140,120,200);
        doc.setFontSize(8);
        doc.setFont('helvetica','bold');
        doc.text('MEMBER SPLIT', margin, sy);
        sy += 5;
        const mW = (W - margin*2 - (splitCount-1)*3) / Math.min(splitCount,4);
        splitNames.forEach((name,i)=>{
          const col = i%4;
          const row2 = Math.floor(i/4);
          const x2 = margin + col*(mW+3);
          const y2 = sy + row2*14;
          doc.setFillColor(40,25,80);
          doc.setDrawColor(70,50,130);
          doc.setLineWidth(0.25);
          doc.roundedRect(x2, y2, mW, 11, 1.5,1.5,'FD');
          doc.setTextColor(160,140,215);
          doc.setFontSize(7);
          doc.setFont('helvetica','normal');
          const firstName = name.split(' ')[0].substring(0,12);
          doc.text(firstName, x2+3, y2+5);
          doc.setTextColor(210,200,255);
          doc.setFontSize(8);
          doc.setFont('helvetica','bold');
          doc.text('Rs '+perP.toFixed(2), x2+3, y2+9.5);
        });
        sy += Math.ceil(splitCount/4)*14 + 6;

        // Items table header
        doc.setFillColor(50,30,100);
        doc.setDrawColor(0,0,0,0);
        doc.rect(margin, sy, W-margin*2, 9, 'F');
        const cols2 = [margin+2, margin+65, margin+85, margin+105, margin+135, margin+158];
        const heads = ['Item Name','Qty','Unit','Price (Rs)','Date','Added By'];
        doc.setTextColor(160,140,220);
        doc.setFontSize(8);
        doc.setFont('helvetica','bold');
        heads.forEach((h,i)=>doc.text(h, cols2[i], sy+6));
        sy += 11;

        // Table rows
        data.forEach((e,idx)=>{
          if(sy>272){ doc.addPage(); doc.setFillColor(7,7,10); doc.rect(0,0,W,297,'F'); sy=20; }
          if(idx%2===0){ doc.setFillColor(20,15,35); doc.rect(margin, sy-3, W-margin*2, 8,'F'); }
          doc.setTextColor(210,200,245);
          doc.setFont('helvetica','normal');
          doc.setFontSize(8);
          const name2 = e.itemName.length>22 ? e.itemName.substring(0,20)+'…' : e.itemName;
          doc.text(name2, cols2[0], sy+3);
          doc.text(String(e.quantity||''), cols2[1], sy+3);
          doc.text(e.unit||'', cols2[2], sy+3);
          doc.setTextColor(180,160,255);
          doc.text('Rs '+Number(e.price).toFixed(2), cols2[3], sy+3);
          doc.setTextColor(160,150,210);
          doc.text(e.date||'', cols2[4], sy+3);
          doc.text((e.addedByName||'').split(' ')[0].substring(0,10), cols2[5], sy+3);
          sy+=8;
        });

        // Footer total line
        sy+=2;
        doc.setDrawColor(80,55,140);
        doc.setLineWidth(0.4);
        doc.line(margin, sy, W-margin, sy);
        sy+=7;
        doc.setTextColor(200,180,255);
        doc.setFontSize(11);
        doc.setFont('helvetica','bold');
        doc.text(`Total: Rs ${total.toFixed(2)}`, W-margin, sy, {align:'right'});
        sy+=7;
        doc.setTextColor(140,120,200);
        doc.setFontSize(9);
        doc.text(`Per Person: Rs ${perP.toFixed(2)}`, W-margin, sy, {align:'right'});

        // Footer bar
        doc.setFillColor(50,30,100);
        doc.rect(0,290,W,7,'F');
        doc.setTextColor(100,85,160);
        doc.setFontSize(7);
        doc.setFont('helvetica','normal');
        doc.text('Generated by RationTrack · rationtrack.app', W/2, 295, {align:'center'});

        doc.save(`RationTrack-${selMonth}.pdf`);
        setDownloading('');
      } catch(err) { alert('PDF export failed: '+err.message); setDownloading(''); }
    }, 400);
  };

  if(sortedMonths.length===0) return (
    <Card cls="text-center py-20 fade-up">
      <IC n="file2" s={40} c="text-white/10 mx-auto mb-4 block"/>
      <p className="text-white/25 text-sm">Koi approved entry nahi hai abhi</p>
      <p className="text-white/15 text-xs mt-1">Entries approve hone ke baad report yahan dikhega</p>
    </Card>
  );

  return (
    <div className="space-y-5 fade-up">

      {/* ── Month Selector Tabs ── */}
      <Card cls="!p-4">
        <p className="text-xs text-white/35 font-medium uppercase tracking-wider mb-3">📅 Mahina Chuniye</p>
        <div className="flex flex-wrap gap-2">
          {sortedMonths.map(m=>{
            const mTotal = monthMap[m].reduce((s,e)=>s+e.price,0);
            const isSel = selMonth===m;
            return (
              <button key={m} onClick={()=>setSelMonth(m)}
                className={`flex flex-col items-start px-3.5 py-2.5 rounded-xl border text-left transition-all ${
                  isSel
                    ? 'btn-primary border-transparent shadow-lg'
                    : 'bg-white/4 border-white/8 hover:bg-white/8 hover:border-white/15'
                }`}>
                <span className={`text-sm font-semibold ${isSel?'text-white':'text-white/65'}`}>{monthLabel(m)}</span>
                <span className={`text-xs mt-0.5 ${isSel?'text-violet-200':'text-white/30'}`}>
                  {monthMap[m].length} items · {inr(mTotal)}
                </span>
                {m===now && <span className="text-xs mt-1 px-1.5 py-0.5 rounded-md bg-emerald-500/25 text-emerald-300 font-semibold">Current</span>}
              </button>
            );
          })}
        </div>
      </Card>

      {/* ── Selected Month Report ── */}
      {data.length > 0 && (
        <>
          {/* Summary + Download */}
          <Card>
            <div className="flex flex-wrap items-start justify-between gap-4 mb-5">
              <div>
                <h2 className="text-lg font-bold text-white">{monthLabel(selMonth)}</h2>
                <p className="text-xs text-white/35 mt-0.5">{data.length} items · {splitCount} members</p>
              </div>
              <div className="flex gap-2">
                <Btn onClick={csvExport} v="sec" sz="md" disabled={downloading==='csv'}>
                  {downloading==='csv'
                    ? <span className="flex items-center gap-1.5"><span className="w-3.5 h-3.5 border-2 border-white/30 border-t-white rounded-full animate-spin inline-block"></span> Bana raha hai...</span>
                    : <><IC n="dl" s={14}/> CSV Download</>
                  }
                </Btn>
                <Btn onClick={pdfExport} sz="md" disabled={downloading==='pdf'}>
                  {downloading==='pdf'
                    ? <span className="flex items-center gap-1.5"><span className="w-3.5 h-3.5 border-2 border-white/30 border-t-white rounded-full animate-spin inline-block"></span> Bana raha hai...</span>
                    : <><IC n="dl" s={14}/> PDF Download</>
                  }
                </Btn>
              </div>
            </div>

            {/* Stat cards */}
            <div className="grid grid-cols-2 lg:grid-cols-3 gap-3 mb-5">
              <div className="p-4 rounded-xl bg-violet-500/8 border border-violet-500/15">
                <p className="text-xs text-white/35 mb-1">Kul Kharcha</p>
                <p className="text-xl font-bold text-white">{inr(total)}</p>
              </div>
              <div className="p-4 rounded-xl bg-blue-500/8 border border-blue-500/15">
                <p className="text-xs text-white/35 mb-1">Per Person (÷{splitCount})</p>
                <p className="text-xl font-bold text-white">{inr(perP)}</p>
              </div>
              <div className="p-4 rounded-xl bg-emerald-500/8 border border-emerald-500/15 col-span-2 lg:col-span-1">
                <p className="text-xs text-white/35 mb-1">Sabse Mehnga Item</p>
                <p className="text-base font-bold text-white truncate">{topItems[0]?topItems[0][0]:'-'}</p>
                <p className="text-xs text-white/40 mt-0.5">{topItems[0]?inr(topItems[0][1]):''}</p>
              </div>
            </div>

            {/* Member split */}
            <div className="mb-5">
              <p className="text-xs text-white/35 font-medium uppercase tracking-wider mb-2">Member Split</p>
              <div className={`grid gap-2 ${splitCount<=2?'grid-cols-2':splitCount===3?'grid-cols-3':'grid-cols-2 lg:grid-cols-4'}`}>
                {splitNames.map((name,i)=>(
                  <div key={i} className="flex items-center gap-2.5 px-3 py-2.5 rounded-xl bg-white/4 border border-white/8">
                    <div className="w-7 h-7 rounded-full btn-primary flex items-center justify-center text-xs font-bold text-white flex-shrink-0">{name.charAt(0)}</div>
                    <div className="min-w-0">
                      <p className="text-xs text-white/45 truncate">{name.split(' ')[0]}</p>
                      <p className="text-sm font-bold text-violet-300">{inr(perP)}</p>
                    </div>
                  </div>
                ))}
              </div>
            </div>

            {/* Top expenses mini chart */}
            {topItems.length>0 && (
              <div className="mb-5">
                <p className="text-xs text-white/35 font-medium uppercase tracking-wider mb-2">Top Items</p>
                <div className="space-y-2">
                  {topItems.map(([name3,amt],i)=>(
                    <div key={i} className="flex items-center gap-3">
                      <span className="text-xs text-white/25 w-4 font-mono flex-shrink-0">{i+1}</span>
                      <div className="flex-1 min-w-0">
                        <div className="flex items-center justify-between mb-1">
                          <span className="text-sm text-white/75 truncate mr-2">{name3}</span>
                          <span className="text-xs text-white/50 flex-shrink-0">{inr(amt)}</span>
                        </div>
                        <div className="h-1 bg-white/6 rounded-full overflow-hidden">
                          <div className="h-full rounded-full" style={{width:`${(amt/topItems[0][1])*100}%`,background:'rgba(124,58,237,0.7)'}}/>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* Full item list */}
            <div>
              <p className="text-xs text-white/35 font-medium uppercase tracking-wider mb-2">Poori List</p>
              <div className="rounded-xl border border-white/6 overflow-hidden">
                <table className="w-full">
                  <thead>
                    <tr className="bg-white/4 border-b border-white/6">
                      <th className="text-left px-3.5 py-3 text-xs text-white/35 font-medium">#</th>
                      <th className="text-left px-3.5 py-3 text-xs text-white/35 font-medium">Item</th>
                      <th className="text-left px-3.5 py-3 text-xs text-white/35 font-medium hidden sm:table-cell">Qty</th>
                      <th className="text-left px-3.5 py-3 text-xs text-white/35 font-medium">Date</th>
                      <th className="text-right px-3.5 py-3 text-xs text-white/35 font-medium">Price</th>
                    </tr>
                  </thead>
                  <tbody>
                    {[...data].sort((a,b)=>new Date(a.date)-new Date(b.date)).map((e,i)=>(
                      <tr key={e.id} className={`border-b border-white/4 last:border-0 ${i%2===0?'':'bg-white/2'}`}>
                        <td className="px-3.5 py-2.5 text-xs text-white/25 font-mono">{i+1}</td>
                        <td className="px-3.5 py-2.5 text-sm text-white/80 font-medium">{e.itemName}</td>
                        <td className="px-3.5 py-2.5 text-xs text-white/40 hidden sm:table-cell">{e.quantity} {e.unit}</td>
                        <td className="px-3.5 py-2.5 text-xs text-white/40">{fmtDate(e.date)}</td>
                        <td className="px-3.5 py-2.5 text-sm font-semibold text-violet-400 text-right">{inr(e.price)}</td>
                      </tr>
                    ))}
                  </tbody>
                  <tfoot>
                    <tr className="bg-violet-500/10 border-t border-violet-500/20">

/* ─── PAYMENTS ─────────────────────────────────────────────────── */
const Payments = ({ entries, payments, onUpdatePayment, user, members }) => {
  const splitNames = (members||DEFAULT_MEMBERS).map(m=>m.name);
  const splitCount = splitNames.length;
  const approved = entries.filter(e=>e.status==='approved');
  const now = monthKey(new Date().toISOString());
  const allMonths = [...new Set(approved.map(e=>monthKey(e.date)))].sort().reverse();
  // Current month first, then past months
  const currentMonthHasData = allMonths.includes(now);
  const months = currentMonthHasData ? allMonths : [now, ...allMonths];
  const [selMonth, setSelMonth] = useState(now);
  const [qrModal, setQrModal] = useState(null);
  const [showPastHistory, setShowPastHistory] = useState(false);

  const mEntries = approved.filter(e=>monthKey(e.date)===selMonth);
  const total = mEntries.reduce((s,e)=>s+e.price,0);
  const perP = total/splitCount;

  const getPS = (memberName) => payments.find(p=>p.month===selMonth && p.userName===memberName);

  const apps = [
    { name:'Google Pay', icon:'🟢' },
    { name:'PhonePe', icon:'🟣' },
    { name:'Paytm', icon:'🔵' },
    { name:'Other UPI', icon:'📲' },
  ];

  /* ── QR Modal — sirf UPI QR dikhata hai, mark as paid nahi ── */
  const QrModal = ({ member }) => {
    const note = `Ration ${monthLabel(selMonth)}`;
    const link = upiUrl(OWNER.upiId, OWNER.name, perP, note);
    const qr = genQR(link);
    return (
      <Modal open title={`Pay ${inr(perP)} — ${member.split(' ')[0]}`} onClose={()=>setQrModal(null)} w="max-w-sm">
        <div className="space-y-4 text-center">
          <div className="text-sm text-white/45">{monthLabel(selMonth)} · {member.split(' ')[0]} ka share</div>
          {qr && (
            <div className="flex justify-center">
              <div className="p-3 bg-white rounded-2xl inline-block shadow-2xl">
                <img src={qr} alt="UPI QR" className="w-44 h-44"/>

            </div>
          )}
          <div className="bg-white/4 rounded-xl px-4 py-3 border border-white/8">
            <p className="text-xs text-white/35 mb-1">Scan with any UPI app or pay to</p>
            <p className="text-base font-mono font-bold text-violet-300">{OWNER.upiId}</p>
            <p className="text-xs text-white/40 mt-0.5">{OWNER.name}</p>
          </div>
          <div className="grid grid-cols-2 gap-2">
            {apps.map(a=>(
              <a key={a.name} href={link} className="flex items-center gap-2 px-3 py-2.5 bg-white/5 hover:bg-white/10 border border-white/8 rounded-xl text-sm text-white/70 hover:text-white transition-all">
                <span>{a.icon}</span> {a.name}

      <div className="space-y-1.5">
        <p className="text-xs text-white/30 font-medium uppercase tracking-wide">Mahina chuniye</p>
        <div className="flex gap-2 flex-wrap">
          {months.slice(0,8).map(m=>(
            <button key={m} onClick={()=>setSelMonth(m)}
              className={`px-4 py-2 rounded-xl text-sm font-medium transition-all flex items-center gap-1.5 ${selMonth===m?'btn-primary text-white':'bg-white/5 text-white/45 hover:text-white/70 hover:bg-white/8'}`}>
              {monthLabel(m)}
              {m===now && <span className="text-xs px-1.5 py-0.5 rounded-md bg-emerald-500/25 text-emerald-400 font-semibold">Current</span>}
            </button>

      {/* Summary */}

                const mData = approved.filter(e=>monthKey(e.date)===month);

/* ─── SETTINGS ─────────────────────────────────────────────────── */
const Settings = ({ user, members, setMembers, users, onUsersChange }) => {
  const [newMemberName, setNewMemberName] = useState('');
  const [editingId, setEditingId] = useState(null);
  const [editingName, setEditingName] = useState('');

  const updateRole = (id, role) => {
    const u = users.map(x=>x.id===id?{...x,role}:x);
    fbSet('users', u);
  };
  const delUser = (id) => {
    if(!confirm('Delete this user?')) return;
    const u = users.filter(x=>x.id!==id);
    fbSet('users', u);
  };

  const addMember = () => {
    const name = newMemberName.trim();
    if (!name) return;
    if (members.find(m => m.name.toLowerCase() === name.toLowerCase())) {
      alert('Member with this name already exists!'); return;
    }
    setMembers([...members, { id: uid(), name }]);
    setNewMemberName('');
  };

  const removeMember = (id) => {
    if (members.length <= 1) { alert('At least 1 member is required!'); return; }
    if (!confirm('Remove this member from the split?')) return;
    setMembers(members.filter(m => m.id !== id));
  };

  const saveEdit = (id) => {
    const name = editingName.trim();
    if (!name) return;
    if (members.find(m => m.name.toLowerCase() === name.toLowerCase() && m.id !== id)) {
      alert('Member with this name already exists!'); return;
    }
    setMembers(members.map(m => m.id === id ? { ...m, name } : m));
    setEditingId(null); setEditingName('');
  };

  if(user.role!=='owner') return (
    <div className="flex flex-col items-center py-16 text-white/25">
      <IC n="cog" s={48} c="opacity-20 mb-4"/>
      <p>Settings are only accessible by the owner</p>

                  value={editingName}

/* ─── MAIN APP ─────────────────────────────────────────────────── */
const App = () => {
  const [user, setUser] = useState(()=>session.get());
  const [page, setPage] = useState('dashboard');
  const [entries, setEntries] = useState([]);
  const [pending, setPending] = useState([]);
  const [payments, setPayments] = useState([]);
  const [notifs, setNotifs] = useState([]);
  const [members, setMembersState] = useState(DEFAULT_MEMBERS);
  const [users, setUsers] = useState([OWNER]);
  const [fbReady, setFbReady] = useState(false);
  const [lastSync, setLastSync] = useState(null);
  const [sideOpen, setSideOpen] = useState(false);

  /* ── Firebase real-time listeners + 30s force refresh ── */
  useEffect(() => {
    if (!fbDB) { setFbReady(true); return; }

    const bump = () => setLastSync(new Date());

    // Firebase stores arrays as objects — convert back to real arrays
    const toArr = (v, fallback=[]) => {
      if (!v) return fallback;
      if (Array.isArray(v)) return v;
      return Object.values(v);
    };

    const unsubs = [
      fbListen('entries',  v => { setEntries(toArr(v)); bump(); }),
      fbListen('pending',  v => { setPending(toArr(v)); bump(); }),
      fbListen('payments', v => { setPayments(toArr(v)); bump(); }),
      fbListen('notifs',   v => { setNotifs(toArr(v)); bump(); }),
      fbListen('members',  v => { setMembersState(toArr(v, DEFAULT_MEMBERS)); bump(); }),
      fbListen('users',    v => {
        const u = toArr(v, [OWNER]);
        setUsers(u);
        bump();
        const loggedIn = session.get();
        if (loggedIn) {
          const fresh = u.find(x => x.id === loggedIn.id);
          if (fresh) { session.set(fresh); setUser(fresh); }
        }
      }),
    ];

    // Force re-fetch from Firebase every 30 seconds
    const syncInterval = setInterval(() => {
      fbDB.ref(FB_PATH).once('value', snap => {
        const d = snap.val() || {};
        setEntries(toArr(d.entries));
        setPending(toArr(d.pending));
        setPayments(toArr(d.payments));
        setNotifs(toArr(d.notifs));
        setMembersState(toArr(d.members, DEFAULT_MEMBERS));
        setUsers(toArr(d.users, [OWNER]));
        bump();
      });
    }, 30000);

    // Seed initial data if Firebase is empty
    fbDB.ref(FB_PATH).once('value', snap => {
      const d = snap.val();
      if (!d || !d.users) {
        fbSet('entries', []);
        fbSet('pending', []);
        fbSet('payments', []);
        fbSet('notifs', []);
        fbSet('members', DEFAULT_MEMBERS);
        fbSet('users', [OWNER]);
      }
      bump();
      setFbReady(true);
    });

    return () => { unsubs.forEach(u => u()); clearInterval(syncInterval); };
  }, []);

  /* ── Helpers ── */
  const save = (key, val) => fbSet(key, val);

  const setMembers = (m) => { save('members', m); };

  const addNotif = useCallback((message) => {
    const n = { id:uid(), message, read:false, createdAt:new Date().toISOString() };
    const updated = [n, ...notifs.slice(0,49)];
    save('notifs', updated);
  }, [notifs]);

  const login = (u) => { session.set(u); setUser(u); setPage('dashboard'); };
  const logout = () => { session.clear(); setUser(null); };

  const addEntries = useCallback((newE) => {
    if(user.role==='owner') {
      save('entries', [...entries, ...newE]);
    } else {
      const chg={ id:uid(), type:'add', entries:newE, requestedBy:user.id, requestedByName:user.name, requestedAt:new Date().toISOString(), status:'pending' };
      save('pending', [...pending, chg]);
    }
  }, [user, entries, pending]);

  const editEntry = useCallback((updated) => {
    if(user.role==='owner') {
      save('entries', entries.map(e=>e.id===updated.id?updated:e));
    } else {
      const chg={ id:uid(), type:'edit', entryData:updated, requestedBy:user.id, requestedByName:user.name, requestedAt:new Date().toISOString(), status:'pending' };
      save('pending', [...pending, chg]);
      addNotif(`${user.name} wants to edit: ${updated.itemName}`);
    }
  }, [user, entries, pending]);

  const deleteEntry = useCallback((id) => {
    if(user.role==='owner') {
      save('entries', entries.filter(e=>e.id!==id));
    } else {
      const entry=entries.find(e=>e.id===id);
      const chg={ id:uid(), type:'delete', entryData:entry, requestedBy:user.id, requestedByName:user.name, requestedAt:new Date().toISOString(), status:'pending' };
      save('pending', [...pending, chg]);
      addNotif(`${user.name} wants to delete: ${entry.itemName}`);
    }
  }, [user, entries, pending]);

  const approve = useCallback((chgId) => {
    const chg=pending.find(c=>c.id===chgId);
    if(!chg) return;
    let newE=[...entries];
    if(chg.type==='add') newE=[...newE,...chg.entries.map(e=>({...e,status:'approved'}))];
    else if(chg.type==='edit') newE=newE.map(e=>e.id===chg.entryData.id?{...chg.entryData,status:'approved'}:e);
    else if(chg.type==='delete') newE=newE.filter(e=>e.id!==chg.entryData.id);
    save('entries', newE);
    save('pending', pending.map(c=>c.id===chgId?{...c,status:'approved'}:c));
    addNotif(`Approved: ${chg.requestedByName}'s ${chg.type} request`);
  }, [entries, pending]);

  const reject = useCallback((chgId) => {
    save('pending', pending.map(c=>c.id===chgId?{...c,status:'rejected'}:c));
    const chg=pending.find(c=>c.id===chgId);
    if(chg) addNotif(`Rejected: ${chg.requestedByName}'s ${chg.type} request`);
  }, [pending]);

  const updatePayment = useCallback((month, memberName, status, screenshotUrl) => {
    const idx=payments.findIndex(p=>p.month===month&&p.userName===memberName);
    let u;
    const paidAt = status==='paid' ? new Date().toISOString() : '';
    // Firebase deletes null — use empty string as fallback so field stays
    const ssUrl = screenshotUrl || (idx>=0 ? (payments[idx].screenshotUrl || '') : '');
    if(idx>=0) u=payments.map(p=>p.month===month&&p.userName===memberName
      ? {...p, status, paidAt, screenshotUrl: ssUrl}
      : p);
    else u=[...payments,{id:uid(),month,userName:memberName,status,paidAt,screenshotUrl:ssUrl}];
    save('payments', u);
  }, [payments]);

  const markAllRead = () => {
    save('notifs', notifs.map(n=>({...n,read:true})));
  };

  /* ── Firebase not configured ── */
  const isConfigured = FIREBASE_CONFIG.apiKey !== "APNI_API_KEY_YAHAN";
  if (!isConfigured) return (
    <div className="min-h-screen bg-[#07070a] flex items-center justify-center p-4">
      <div className="max-w-lg w-full fade-up">
        <div className="text-center mb-6">
          <div className="inline-flex items-center justify-center w-14 h-14 rounded-2xl btn-primary mb-4 text-2xl">🔥</div>
          <h1 className="text-2xl font-bold text-white">Firebase Setup Required</h1>
          <p className="text-white/40 text-sm mt-1">Real-time sync ke liye Firebase config karo</p>
        </div>
        <div className="glass rounded-2xl p-5 space-y-4 text-sm">
          <p className="text-white/70 font-semibold">Sirf 5 minute lagenge — ek baar karo, sab devices sync ho jaayenge:</p>
          <div className="space-y-3">
            {[
              ['1', 'firebase.google.com pe jao → Create project (free)'],
              ['2', 'Build → Realtime Database → Create database → Start in test mode'],
              ['3', 'Project Settings ⚙️ → Your apps → Add Web App → Register'],
              ['4', 'firebaseConfig copy karo'],
              ['5', 'Is file mein FIREBASE_CONFIG object mein apna config paste karo'],
            ].map(([n,t]) => (
              <div key={n} className="flex gap-3">
                <span className="w-6 h-6 rounded-full btn-primary flex items-center justify-center text-xs font-bold flex-shrink-0">{n}</span>
                <span className="text-white/60">{t}</span>
              </div>
            ))}
          </div>
          <div className="mt-4 p-3 bg-white/4 rounded-xl border border-white/8">
            <p className="text-xs text-white/35 mb-2 font-mono">Is file mein dhundo aur replace karo:</p>
            <pre className="text-xs text-violet-300 font-mono overflow-x-auto">{`const FIREBASE_CONFIG = {
  apiKey: "APNI_API_KEY_YAHAN",  ← yahan apna paste karo
  ...
};`}</pre>
          </div>
        </div>
      </div>
    </div>
  );

  /* ── Loading screen while Firebase connects ── */
  if (!fbReady) return (
    <div className="min-h-screen bg-[#07070a] flex flex-col items-center justify-center gap-4">
      <div className="w-10 h-10 rounded-2xl btn-primary flex items-center justify-center text-xl font-bold blink">R</div>
      <p className="text-white/40 text-sm">Cloud se connect ho raha hai...</p>
    </div>
  );

  const pendingCount = pending.filter(c=>c.status==='pending').length;
  const titles = { dashboard:'Dashboard', add:'Add Entry', entries:'All Entries', approvals:'Approvals', reports:'Reports', payments:'Payments', settings:'Settings' };

  if(!user) return <AuthPage onLogin={login}/>;

  const pages = {
    dashboard: <Dashboard entries={entries} pending={pending} payments={payments} user={user} members={members} lastSync={lastSync}/>,
    add: <AddEntry user={user} onAdd={addEntries} addNotif={addNotif}/>,
    entries: <Entries entries={entries} user={user} onDelete={deleteEntry} onEdit={editEntry}/>,
    approvals: <Approvals pending={pending} onApprove={approve} onReject={reject} user={user}/>,
    reports: <Reports entries={entries} members={members}/>,
    payments: <Payments entries={entries} payments={payments} onUpdatePayment={updatePayment} user={user} members={members}/>,
    settings: <Settings user={user} members={members} setMembers={setMembers} users={users}/>,
  };

  return (
    <div className="min-h-screen bg-[#07070a]">
      <Sidebar page={page} setPage={setPage} user={user} logout={logout} pendingCount={pendingCount} open={sideOpen} setOpen={setSideOpen}/>
      <div className="lg:ml-56 min-h-screen flex flex-col">
        <Topbar title={titles[page]||'Dashboard'} user={user} notifs={notifs} onMarkRead={markAllRead} openSidebar={()=>setSideOpen(true)} lastSync={lastSync}/>
        <main className="flex-1 p-4 lg:p-6 max-w-5xl mx-auto w-full">
          {pages[page]||pages.dashboard}
        </main>
      </div>
    </div>
  );
};

ReactDOM.render(<App/>, document.getElementById('root'));
</script>
</body>
</html>
